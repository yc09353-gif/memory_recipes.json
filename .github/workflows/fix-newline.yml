name: Fix trailing newlines

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact trailing newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("memory_recipes.json", "memory_recipes_v2.json"):
              p = Path(name)
              data = p.read_bytes()
              if not data.endswith(b"\n"):
                  p.write_bytes(data + b"\n")
          PY
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add memory_recipes.json memory_recipes_v2.json
            git commit -m "Restore exact trailing newlines"
            git push
          fi
